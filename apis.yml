aid: sales-patriot
name: Sales Patriot
description: 'SalesPatriot deploys artificial intelligence into enterprise supply chain
  operations, embedding engineers onsite to build custom AI solutions that integrate
  fragmented business systems (ERP, CRM, email, spreadsheets, and supplier portals)
  and automate routine workflows. The platform aggregates data from scattered sources
  into a unified, searchable system, automates tasks such as quoting, sourcing, and
  data entry, and visualizes real-time operational metrics for executives. It serves
  defense contracting and procurement, complex multi-source procurement operations,
  and high-volume distribution. SalesPatriot is a portfolio company of CRV. This profile
  was added to the API Evangelist network and enriched by the pipeline; the company
  publishes no public developer or API surface at this time.'
